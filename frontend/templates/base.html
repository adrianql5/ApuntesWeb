<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{descripcion}}">
<title>{{titulo}} · ApuntesWeb</title>
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{rel}}vendor/katex/katex.min.css">
<link rel="stylesheet" href="{{rel}}css/estilos.css">
<script>
// Aplica el tema guardado antes del primer pintado para evitar parpadeo
try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
</head>
<body data-rel="{{rel}}">
<a class="salto" href="#contenido">Saltar al contenido</a>
<header class="cabecera">
  <div class="cabecera-interior">
    <a class="marca" href="{{rel}}index.html">Apuntes<span class="marca-web">Web</span></a>
    <button id="boton-buscar" type="button">Buscar <kbd>Ctrl</kbd><kbd>K</kbd></button>
    <button id="boton-tema" type="button" aria-label="Cambiar tema claro/oscuro">◐</button>
  </div>
</header>
<nav class="migas" aria-label="Estás en">{{{migas}}}</nav>
<div class="disposicion{{claseDisposicion}}">
{{{lateral}}}
<main class="principal" id="contenido">
{{{contenido}}}
</main>
</div>
<div class="paleta-fondo" id="paleta-fondo" hidden>
  <div class="paleta" role="dialog" aria-modal="true" aria-label="Buscar en los apuntes">
    <input id="paleta-entrada" type="search" name="buscar" aria-label="Buscar en los apuntes"
      placeholder="Busca un tema, asignatura o apartado…" autocomplete="off" spellcheck="false">
    <ul id="paleta-resultados" aria-live="polite"></ul>
    <div class="paleta-pie">
      <span><kbd>↑</kbd><kbd>↓</kbd> moverse</span>
      <span><kbd>↵</kbd> abrir</span>
      <span><kbd>Esc</kbd> cerrar</span>
    </div>
  </div>
</div>
<script src="{{rel}}js/app.js"></script>
</body>
</html>
