<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{descripcion}}">
<title>{{titulo}} · ApuntesWeb</title>
<link rel="stylesheet" href="{{rel}}vendor/katex/katex.min.css">
<link rel="stylesheet" href="{{rel}}css/estilos.css">
<script>
// Aplica el tema guardado antes del primer pintado para evitar parpadeo
try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
</head>
<body>
<header class="cabecera">
  <div class="cabecera-interior">
    <a class="marca" href="{{rel}}index.html">Apuntes<span class="marca-web">Web</span></a>
    <button id="boton-tema" type="button" aria-label="Cambiar tema claro/oscuro">◐</button>
  </div>
</header>
<nav class="migas" aria-label="Estás en">{{{migas}}}</nav>
<main class="principal">
{{{contenido}}}
</main>
<footer class="pie">
  <p>Apuntes personales de Ingeniería Informática · escritos en Obsidian, publicados con un generador propio.</p>
  <p><a href="https://github.com/adrianql5/ApuntesWeb">Código en GitHub</a></p>
</footer>
<script src="{{rel}}js/app.js"></script>
</body>
</html>
