<article class="nota">
  <header class="apertura" data-numero="{{numeroTema}}">
    <p class="apertura-asignatura"><a href="index.html">{{fichaAsignatura}}</a></p>
    <h1>{{encabezado}}</h1>
    <p class="apertura-datos">
      <span>{{fichaTema}}</span>
      <span>{{fichaCurso}}</span>
      <span data-minutos="{{minutos}}">≈ {{minutos}} min de lectura</span>
    </p>
  </header>
{{{indiceMovil}}}
  <div class="prosa">
{{{cuerpo}}}
  </div>
</article>
<nav class="nota-nav" aria-label="Navegación entre temas">
  {{{anterior}}}
  {{{siguiente}}}
</nav>
